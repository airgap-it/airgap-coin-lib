name: Build

on:
  push:
  workflow_dispatch:

# Least privilege: every job only reads the repository. Jobs that need more must ask for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Dockerfile (node:24), airgap-vault and airgap-wallet.
  NODE_VERSION: '24'

jobs:
  build:
    name: 🏗️ Build, Test & Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --ignore-scripts: no lifecycle script runs, neither the dependencies' (native keccak and
      # secp256k1 builds fall back to JS) nor the root prepare (husky install).
      - name: 🔧 Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Test
        run: npm run test-ci

      - name: 🧪 Integration tests
        run: npm run test:integration

      - name: 🧹 Lint
        if: ${{ !cancelled() }}
        run: npm run lint-ci

      - name: 📦 Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            lint-reports
            packages/*/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
